<!DOCTYPE html>
<html>
  <head>
    <title>Test Lesson for Meta Tags - Langlets</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- These are the meta tags that should be generated by your content_for :head block -->
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="http://localhost:3000/lessons/test-lesson">
    <meta property="og:title" content="Test Lesson for Meta Tags - Langlets">
    <meta property="og:description" content="Learn Hebrew with interactive video lessons. Practice listening, speaking, and comprehension.">
    <meta property="og:image" content="https://img.youtube.com/vi/dQw4w9WgXcQ/maxresdefault.jpg">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="720">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="http://localhost:3000/lessons/test-lesson">
    <meta property="twitter:title" content="Test Lesson for Meta Tags - Langlets">
    <meta property="twitter:description" content="Learn Hebrew with interactive video lessons. Practice listening, speaking, and comprehension.">
    <meta property="twitter:image" content="https://img.youtube.com/vi/dQw4w9WgXcQ/maxresdefault.jpg">
    
    <!-- WhatsApp and other messaging apps -->
    <meta property="og:site_name" content="Langlets">
    <meta property="og:locale" content="en_US">

    <link rel="icon" href="/icon.png" type="image/png">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon.png">
  </head>

  <body class="bg-gray-900 min-h-screen flex flex-col">
    <main class="flex-grow">
      <h1>Test Lesson Page</h1>
      <p>This is what your lesson page should look like with proper meta tags.</p>
      <p>The meta tags above should be generated by the content_for :head block in your show.html.erb file.</p>
    </main>
  </body>
</html>
