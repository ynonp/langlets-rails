  app:
    home:
      index:
        your_playlists: "Your playlists"
        continue: "Continue"
        library: "Library"
        # First run only — nothing enrolled, nothing in progress. The grid is the
        # whole screen then, so it gets an invitation instead of a section label,
        # and the create link names the other way in. Both revert once the user
        # has a course.
        #
        # The heading matches courses.index.library.heading word for word: the
        # marketing root and the app's first run are the same moment for the same
        # person. Duplicated rather than shared, because a change to one is not
        # automatically right for the other. Its subhead is deliberately NOT
        # carried over — the cards say what they are, and the screen reads better
        # without a line of prose between the heading and the grid.
        first_run_library: "Jump right in"
        first_run_create: "Or import any YouTube / TikTok video ›"
    library:
      show:
        title: "Library"
        description: "Every video the community has turned into lessons."
    import_requests:
      index:
        # `title` and `empty` are the browser wording; the `native_*` keys are
        # the Hotwire Native "Create" tab, which the web queue does not share.
        title: "Queue"
        empty: "Nothing here yet."
        native_title: "Create"
        # Says both ways in, in the order people find them: the share sheet is
        # the habit we want, "Add New" is the button right there on screen.
        intro: "Create langlets by sharing a YouTube or TikTok video to the app, or tap “Add New” below. Each langlet takes about 3 minutes to create and costs 1 credit."
