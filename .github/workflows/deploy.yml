name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Configure production credentials
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          install -m 600 /dev/null config/credentials/production.key
          printf '%s' "$RAILS_MASTER_KEY" > config/credentials/production.key
          install -m 700 -d .kamal
          install -m 600 /dev/null .kamal/secrets
          printf '%s\n' \
            'RAILS_MASTER_KEY=$RAILS_MASTER_KEY' \
            'DATABASE_URL=$(./bin/rails credentials:show --environment production | ruby -ryaml -e '\''puts YAML.safe_load(STDIN.read, aliases: true).dig("db", "kamal", "url")'\'')' \
            'POSTGRES_PASSWORD=$(./bin/rails credentials:show --environment production | ruby -ryaml -ruri -e '\''puts URI.parse(YAML.safe_load(STDIN.read, aliases: true).dig("db", "kamal", "url")).password'\'')' \
            > .kamal/secrets
          ./bin/rails credentials:show --environment production > /dev/null

      - name: Configure SSH
        env:
          KAMAL_SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
          KAMAL_SSH_KNOWN_HOSTS: ${{ secrets.KAMAL_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_rsa
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$KAMAL_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          printf '%s\n' "$KAMAL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to production
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bundle exec kamal deploy
