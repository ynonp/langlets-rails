    mark_all_read: "Mark all as read"
    time_ago: "%{time} ago"
    unread_badge: "%{count} unread notifications"
    settings_link: "Change how you receive notifications"
    # Every word the app says in a notification. Rendered on demand by
    # Notification#title/#body against the values Notifications::Content stored
    # on the row, so editing anything here also fixes notifications that have
    # already been sent.
    #
    # The interpolations are a contract with rows that already exist: adding one
    # to a template that older rows have no value for makes them unrenderable
    # (they fall back to `unavailable` below). Add the value in Content first,
    # or give the new template a form that works without it.
    kinds:
      # Used when an import failed before it ever learned what it was importing.
      default_video_title: "Your video"
      course_ready:
        title: "“%{video_title}” is ready!"
        body:
          one: "“%{video_title}” is now %{count} lesson. Tap to start practicing."
          other: "“%{video_title}” is now %{count} lessons. Tap to start practicing."
      course_failed:
        title: "Course creation failed"
        body: "We couldn't import “%{video_title}”. No credit was charged. We're looking into it and will let you know when it's ready."
      pro_activated:
        title: "You're a Pro subscriber now"
        body: "Great — Langlets Pro is active. Import as much as you like; every course you add is included."
    # Shown in place of a notification whose template no longer renders. Always
    # a bug on our side; see Notification#render.
    unavailable: "This notification is no longer available."
    empty:
      title: "Nothing yet"
      body: "We'll tell you here when a course is ready."
    preferences:
      heading: "Notifications"
      description: "How we tell you when a course is ready."
      label: "Send notifications by"
      email: "Email"
      push: "Push"
      updated: "Notification preferences saved."
    # The email. `_html` so the profile link interpolates as markup; the
    # plain-text alternative says the same thing and puts the URL on its own
    # line underneath.
    mailer:
      open: "Open Langlets"
      footer_html: "You choose how notifications reach you — email, push, both or neither — on your %{link}."
      footer_link: "profile page"
      footer_text: "Choose how notifications reach you — email, push, both or neither — on your profile page:"
  # The account page. `channels.profile.*` covers the channel card at the top;
  # everything below it lives here.
  profile:
    # Native only — Pro is an iOS in-app purchase, so this card (and its
    # upgrade button) never renders on the web profile page.
    account:
      heading: "Account"
      type_free: "Free"
      type_pro: "Pro"
      pro_description: "Unlimited imports · library synced"
      upgrade_cta: "Upgrade to Pro for unlimited imports"
    xp:
      heading: "XP this week"
      all_time: "%{count} XP all time"
      streak:
        one: "%{count} day streak"
        other: "%{count} days streak"
      # Same streak, before today's lesson. One sentence rather than a suffix
      # glued onto the other key: word order is a translator's decision.
      streak_pending:
        one: "%{count} day streak — no lesson yet today"
        other: "%{count} days streak — no lesson yet today"
      no_streak: "Complete a lesson to start a streak."
      day_xp: "%{day}: %{xp} XP"
    # The iOS permission card. Its copy is replaced live by
    # bridge/notification_preference_controller.js — see js.notification_preference,
    # which has to stay in step with this.
    push:
      heading: "Push on this device"
      description: "Get notified when items in your Queue are ready."
      enable: "Enable Notifications"
      switch_label: "Queue-ready notifications"
    theme:
      heading: "Theme"
      description: "Currently %{theme}. Tap to switch between light and dark."
      light: "light"
      dark: "dark"
    continue: "Continue Learning"
    delete:
      heading: "Delete my account"
      description: "This permanently deletes your account and everything attached to it — your saved words, progress, XP and streak, and any courses you created. It can't be undone."
      button: "Delete account"
      confirm: "Permanently delete your account and all your saved words and progress? This can't be undone."
