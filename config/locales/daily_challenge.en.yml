      recommendation:
        title: "A video picked for you"
        body: "We found a video we hope you’ll like, inspired by your videos and vocabulary. Preview it and make it your next langlet."
      song:
        title: Import a song
        body: Pick a song in a language you're learning. Import it to turn the lyrics into your next langlet. One song is enough, even if you chose several languages.
      vocabulary:
        title: Save four words
        body: Open a langlet, tap words you want to remember, and save four to your vocabulary. Choose words you could use in real life.
      story:
        title: Import a short story
        body: Pick a short story in a language you're learning and import it. Follow the characters and see how much you understand.
      tiktok:
        title: Import a TikTok clip
        body: Find a short clip with clear speech in a language you're learning. Import its link and turn an everyday moment into practice.
      skim:
        title: Learn a langlet in one go
        body: Open a langlet and watch the video. You can click “Skip lesson” to skim through the lessons without doing every exercise. Follow the story at your own pace in one sitting.
