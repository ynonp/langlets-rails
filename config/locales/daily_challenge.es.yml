    intro: Un vídeo diario que esperamos que te guste. Elige tus idiomas y cuándo quieres recibirlo. Empieza con cinco actividades para conocer Langlets y después descubre un vídeo elegido para ti cada día.
    choose_languages: ¿Qué quieres aprender?
    selection_hint: Elige uno o varios idiomas para tu Langlets diario.
    invalid_selection: Elige al menos un idioma y una hora válida.
    reminder_time_label: ¿A qué hora quieres el recordatorio diario?
    reminder_time_hint: Elige una hora y zona horaria. Tu primer Langlets diario llegará mañana a esa hora.
    timezone_label: Tu zona horaria
    waiting_title: Tu primer Langlets diario llega mañana
    waiting_body: "Lo enviaremos el %{time}. Mientras tanto, puedes explorar Langlets."
    recommendation:
      waiting_title: "Tu próximo Langlets diario"
      preparing: "Estamos buscando un vídeo para ti. Vuelve pronto o elige tu propio vídeo."
      unavailable: "La selección de hoy no está disponible. Puedes elegir un vídeo que te guste."
    no_daily_lesson: Importa un vídeo o guarda palabras para empezar tu lección diaria.
    practice:
      title: "Practica %{language} hoy"
      body: Terminaste las cinco misiones iniciales. Sigue con una lección diaria.
      open: Abrir la lección de hoy
    invalid_languages: Elige al menos un idioma disponible.
    reminders: ¿Cómo quieres recibir tu Langlets diario?
    reminders_hint: Estas opciones también se aplican a las otras notificaciones de
      Langlets. Las notificaciones push están disponibles en iPhone y requieren permiso.
      En la web o Android, elige correo electrónico. Puedes cambiarlo en tu perfil.
    channels:
      email: Correo electrónico
      push: Notificación push
    start: ¡Vamos!
    settings: Idiomas y recordatorios
    day: Día %{day}
    progress:
      one: 1 de 5 actividades iniciales completadas
      other: '%{count} de 5 actividades iniciales completadas'
    import_video: Importar
    importing_video: Importando…
    preview_import: Ver e importar
    empty_catalog: Puedes elegir un video que te guste en este idioma con el enlace
      de abajo.
    import_cost: Las importaciones usan tus créditos habituales. Verás el coste antes
      de confirmar.
    own_video: Elige tu propio video
    open_library: Abrir tu biblioteca
    open_vocabulary: Abrir vocabulario
    complete: Listo por hoy
    completed: ¡Que disfrutes el resto del día!
    locked: Se desbloquea el %{date}
    quests:
      recommendation:
        title: "Un vídeo elegido para ti"
        body: "Encontramos un vídeo que esperamos que te guste, inspirado en tus vídeos y vocabulario. Mira la vista previa y conviértelo en tu próximo langlet."
      song:
        title: Importa una canción
        body: Elige una canción en un idioma que estás aprendiendo e impórtala para
          convertir su letra en tu próximo langlet. Basta con una canción, aunque
          hayas elegido varios idiomas.
      vocabulary:
        title: Guarda cuatro palabras
        body: Abre un langlet, toca las palabras que quieres recordar y guarda cuatro
          en tu vocabulario. Elige palabras que puedas usar en tu día a día.
      story:
        title: Importa un cuento corto
        body: Elige un cuento corto en un idioma que estás aprendiendo e impórtalo.
          Sigue a los personajes y descubre cuánto entiendes.
      tiktok:
        title: Importa un video de TikTok
        body: Busca un video corto con voz clara en un idioma que estás aprendiendo.
          Importa el enlace y convierte un momento cotidiano en práctica.
      skim:
        title: Aprende un langlet de una vez
        body: Abre un langlet y mira el video. Puedes pulsar «Saltar lección» para
          recorrer las lecciones sin hacer todos los ejercicios. Sigue la historia
          a tu ritmo en una sola sesión.
  notifications:
    kinds:
      daily_challenge_recommendation:
        title: "Tu Langlets diario"
        body: "La selección de hoy: «%{video_title}». ¡Esperamos que te guste!"
      daily_practice:
        title: "Es hora de practicar %{language}"
        body: Tu lección diaria está lista.
      daily_challenge:
        title: 'Langlets diario: día %{day}'
        body: '%{quest_title}: %{quest_body}'
