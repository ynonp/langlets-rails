  app:
    home:
      index:
        daily_vocab:
          title: "Your daily vocabulary review"
          body: "A few minutes today will help these words stick."
        your_playlists: "Your playlists"
        continue: "Continue"
        recommendations: "Recommended for you"
        no_langlets: "No langlets yet. Share any video in Spanish, French, Hebrew, Arabic or German to langlets to turn it into a language practice."
      # The Pro row, directly under the header. Keyed to the partial that renders
      # it (_pro_card), not to index — these lived under `index` while the
      # partial looked them up lazily, so every string resolved to nothing and
      # the card rendered Rails' humanised key names ("Title", "Free Used").
      #
      # Two states: the upsell once the account is out of credits, and a plain
      # statement of what an active subscription is doing once there is one. A
      # subscription the app stops mentioning is one people forget they pay for,
      # and then dispute.
      pro_card:
        upsell:
          # The headline names the blocked action, not the product. The button
          # underneath repeats the verb on purpose — it is the tap target, and a
          # CTA that only says "See plans" hides what the tap commits to.
          title: "Upgrade to Pro to import more content"
          body: "You've used all %{count} free imports. Pro imports are unlimited."
          cta: "Upgrade to Pro"
        pro:
          title: "Langlets Pro"
          badge: "ACTIVE"
          body: "Unlimited imports · library synced"
    pro:
      show:
        page_title: "Langlets Pro"
        close: "Close"
        title: "Learn without limits"
        # Two leads, because the paywall is reached both by running out and by
        # tapping the Home banner with credits still in hand. Telling the second
        # person they've used everything is a small lie at the exact moment it
        # costs the most.
        lead: "You've used %{used} of your %{count} free imports. Go unlimited before you run out."
        lead_all_used: "You've used your %{count} free imports. Keep turning the videos you love into lessons."
        benefits:
          imports:
            title: "Unlimited video imports"
            body: "Any YouTube or TikTok video, whenever you want."
          library:
            title: "Your whole library, in the cloud"
            body: "Every lesson you generate stays synced and ready."
        # Pro is free to ask for — there is no plan to pick, just an invite.
        discord:
          title: "Get Pro for free"
          body: "Join our Discord, introduce yourself, and we'll set your account up with Pro by hand."
          cta: "Join the Discord"
          note: "Pro includes cloud access to the lessons you generate; anything you imported with credits, and every word you've saved, stays yours either way."
      success:
        page_title: "You're Pro!"
        title: "You're Pro!"
        body: "Unlimited imports are live, and every lesson you generate stays synced in your cloud library."
        cta: "Start importing"
        manage: "Manage or cancel anytime in Settings."
    library:
      filters:
        label: "Filter library"
        all: "All"
        pending: "Pending"
        failed: "Failed"
        my_imports: "My imports"
        playlists: "Playlists"
      import_card:
        creating: "Creating"
        failed: "Failed"
        queued: "Queued — up next"
        failed_detail: "Import failed — credit refunded"
      show:
        title: "Library"
        eyebrow: "Learn from any video"
        description: "Every video the community has turned into lessons."
        search: "Search titles, channels, or video links"
        empty: "No library items match this filter."
    web_menu:
      label: "Main navigation"
      library: "Library"
      create: "Create"
    # The native shell's own header menu. Separate from web_menu above because
    # it is a different menu with its own wording, on a screen the web never
    # renders.
    menu:
      open: "Open profile menu"
      review_words: "Practice Words (%{language})"
    import_requests:
      index:
        # `title` and `empty` are the browser wording; the `native_*` keys are
        # the Hotwire Native "Create" tab, which the web queue does not share.
        title: "Queue"
        empty: "Nothing here yet."
        native_title: "Create"
        # Says both ways in, in the order people find them: the share sheet is
        # the habit we want, "Add New" is the button right there on screen.
        intro: "Create langlets by sharing a YouTube or TikTok video to the app, or tap “Add New” below. Each langlet takes about 3 minutes to create and costs 1 credit."
        credits_remaining: "Credits remaining: %{credits}"
        credits_add: "Tap for Langlets Pro"
        created_heading: "My Created Langlets"
        native_empty: "You haven't created any langlets yet"
        add_new: "Add New"
        failed_help_label: "Why this import failed"
        failed_help: "Our automatic langlets maker ran into some issues trying to import this video. Our human team is checking what went wrong, and we'll notify you when the import is finished."
      new:
        # Doubles as the native navigation-bar title now that this screen is
        # pushed rather than presented, so no " · langlets." suffix — the nav bar
        # is not a browser tab.
        page_title: "Add a video"
        title: "Add a video"
        credits_subtitle: "%{credits} — each import uses 1."
        # Pro replaces every price on this screen. Quoting a balance to somebody
        # whose meter no longer runs invites them to worry about it.
        pro_subtitle: "Langlets Pro — import as much as you like."
        pro_balance_label: "Your plan"
        pro_balance: "Langlets Pro — unlimited"
        included_with_pro: "Included with Pro"
        approve_pro: "Approve · included with Pro"
        # Their own import, in a Pro library their subscription no longer lends
        # them. Nothing is charged and nothing is enrolled — the only way back in
        # is to resubscribe, so that is the only thing offered.
        paused: "You imported this with Langlets Pro. It's still in your library, paused until your subscription is active again."
        paused_cta: "Reactivate Pro"
        paused_web_hint: "Reactivate Pro in the Langlets app on your iPhone to open it again."
        paused_notice: "That one's in your paused Pro library."
        # After Approve on a video that already had a course. Nothing was built,
        # but the course was published into their library, which is the thing a
        # credit buys.
        added_notice_charged: "Added to your library — %{cost} credit used."
        added_notice_pro: "Added to your library — included with Pro."
        already_yours_notice: "That one's already in your library."
        share_hint: "You can also share a YouTube or TikTok video directly to Langlets from its Share menu."
        video_language: "Video language"
        paste_placeholder: "Paste a YouTube or TikTok link"
        url_hint: "Works with youtube.com and youtu.be links, tiktok.com posts and share links, or a YouTube video ID"
        link_recognized: "Link recognized"
        get_started: "Paste a YouTube or TikTok link to get started."
        imports_as_lesson: "Imports as a lesson: transcript, translations, vocab cards."
        approve: "Approve · use %{cost}"
        get_pro: "Get Langlets Pro"
        # Web has no way to sell the subscription — Pro is an iOS in-app
        # purchase — so out of credits it explains rather than offering a CTA.
        out_of_credits_web_hint: "You've used your free imports. Subscribe to Langlets Pro in the Langlets app on your iPhone to keep importing."
        already_in_library: "Already in your library."
        open_lesson: "Open lesson"
        already_importing: "Already importing."
        view_in_queue: "View in queue"
        view_in_create: "View in Create"
        view_in_library: "View in Library"
