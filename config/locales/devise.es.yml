es:
  devise:
    confirmations:
      confirmed: Tu dirección de correo electrónico se ha confirmado correctamente.
      send_instructions: En unos minutos recibirás un correo con instrucciones para confirmar tu dirección.
      send_paranoid_instructions: Si tu dirección de correo está en nuestra base de datos, en unos minutos recibirás instrucciones para confirmarla.
    failure:
      already_authenticated: Ya has iniciado sesión.
      inactive: Tu cuenta aún no está activada.
      invalid: '%{authentication_keys} o contraseña incorrectos.'
      locked: Tu cuenta está bloqueada.
      last_attempt: Te queda un intento antes de que se bloquee tu cuenta.
      not_found_in_database: '%{authentication_keys} o contraseña incorrectos.'
      timeout: Tu sesión ha caducado. Inicia sesión de nuevo para continuar.
      unauthenticated: Debes iniciar sesión o registrarte antes de continuar.
      unconfirmed: Debes confirmar tu dirección de correo electrónico antes de continuar.
    mailer:
      confirmation_instructions:
        subject: Instrucciones de confirmación
      reset_password_instructions:
        subject: Instrucciones para restablecer tu contraseña
      unlock_instructions:
        subject: Instrucciones de desbloqueo
      email_changed:
        subject: Dirección de correo electrónico cambiada
      password_change:
        subject: Contraseña cambiada
    omniauth_callbacks:
      failure: 'No se pudo iniciar sesión con %{kind} porque «%{reason}».'
      success: Has iniciado sesión correctamente con tu cuenta de %{kind}.
    passwords:
      no_token: No puedes acceder a esta página sin usar el enlace del correo de restablecimiento de contraseña. Si has usado ese enlace, asegúrate de haber copiado la URL completa.
      send_instructions: En unos minutos recibirás un correo con instrucciones para restablecer tu contraseña.
      send_paranoid_instructions: Si tu dirección de correo está en nuestra base de datos, en unos minutos recibirás un enlace para restablecer tu contraseña.
      updated: Tu contraseña se ha cambiado correctamente. Has iniciado sesión.
      updated_not_active: Tu contraseña se ha cambiado correctamente.
    registrations:
      destroyed: Tu cuenta se ha eliminado correctamente. Esperamos volver a verte pronto.
      signed_up: ¡Te damos la bienvenida! Te has registrado correctamente.
      signed_up_but_inactive: Te has registrado correctamente, pero no hemos podido iniciar tu sesión porque tu cuenta aún no está activada.
      signed_up_but_locked: Te has registrado correctamente, pero no hemos podido iniciar tu sesión porque tu cuenta está bloqueada.
      signed_up_but_unconfirmed: Te hemos enviado un correo con un enlace de confirmación. Sigue el enlace para activar tu cuenta.
      update_needs_confirmation: Tu cuenta se ha actualizado, pero necesitamos verificar tu nueva dirección de correo. Revisa tu correo y sigue el enlace de confirmación.
      updated: Tu cuenta se ha actualizado correctamente.
      updated_but_not_signed_in: Tu cuenta se ha actualizado correctamente. Como has cambiado tu contraseña, debes iniciar sesión de nuevo.
    sessions:
      signed_in: Has iniciado sesión correctamente.
      signed_out: Has cerrado sesión correctamente.
      already_signed_out: Has cerrado sesión correctamente.
    unlocks:
      send_instructions: En unos minutos recibirás un correo con instrucciones para desbloquear tu cuenta.
      send_paranoid_instructions: Si tu cuenta existe, en unos minutos recibirás un correo con instrucciones para desbloquearla.
      unlocked: Tu cuenta se ha desbloqueado correctamente. Inicia sesión para continuar.
  errors:
    messages:
      already_confirmed: ya se ha confirmado; intenta iniciar sesión
      confirmation_period_expired: debe confirmarse en un plazo de %{period}; solicita otro enlace
      expired: ha caducado; solicita otro
      not_found: no se ha encontrado
      not_locked: no estaba bloqueada
      not_saved:
        one: '1 error impidió guardar %{resource}:'
        other: '%{count} errores impidieron guardar %{resource}:'
