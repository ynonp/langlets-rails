es:
  date:
    formats:
      default: '%d/%m/%Y'
      short: '%d de %b'
      long: '%d de %B de %Y'
    day_names: [domingo, lunes, martes, miércoles, jueves, viernes, sábado]
    abbr_day_names: [dom, lun, mar, mié, jue, vie, sáb]
    month_names: [~, enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre]
    abbr_month_names: [~, ene, feb, mar, abr, may, jun, jul, ago, sep, oct, nov, dic]
    order: [day, month, year]
  time:
    formats:
      default: '%A, %d de %B de %Y %H:%M:%S %z'
      short: '%d de %b %H:%M'
      long: '%d de %B de %Y %H:%M'
    am: a. m.
    pm: p. m.
  datetime:
    distance_in_words:
      half_a_minute: medio minuto
      less_than_x_seconds:
        one: menos de un segundo
        other: menos de %{count} segundos
      x_seconds:
        one: un segundo
        other: '%{count} segundos'
      less_than_x_minutes:
        one: menos de un minuto
        other: menos de %{count} minutos
      x_minutes:
        one: un minuto
        other: '%{count} minutos'
      about_x_hours:
        one: alrededor de una hora
        other: alrededor de %{count} horas
      x_days:
        one: un día
        other: '%{count} días'
      x_months:
        one: un mes
        other: '%{count} meses'
      about_x_months:
        one: alrededor de un mes
        other: alrededor de %{count} meses
      x_years:
        one: un año
        other: '%{count} años'
      about_x_years:
        one: alrededor de un año
        other: alrededor de %{count} años
      over_x_years:
        one: más de un año
        other: más de %{count} años
      almost_x_years:
        one: casi un año
        other: casi %{count} años
    prompts:
      year: Año
      month: Mes
      day: Día
      hour: Hora
      minute: Minuto
      second: Segundo
  errors:
    format: '%{attribute} %{message}'
    messages:
      accepted: debe aceptarse
      blank: no puede estar en blanco
      present: debe estar en blanco
      confirmation: no coincide con %{attribute}
      empty: no puede estar vacío
      equal_to: debe ser igual a %{count}
      even: debe ser par
      exclusion: está reservado
      greater_than: debe ser mayor que %{count}
      greater_than_or_equal_to: debe ser mayor o igual que %{count}
      inclusion: no está incluido en la lista
      invalid: no es válido
      less_than: debe ser menor que %{count}
      less_than_or_equal_to: debe ser menor o igual que %{count}
      model_invalid: 'La validación falló: %{errors}'
      not_a_number: no es un número
      not_an_integer: debe ser un número entero
      odd: debe ser impar
      required: debe existir
      taken: ya está en uso
      too_long:
        one: es demasiado largo (máximo 1 carácter)
        other: es demasiado largo (máximo %{count} caracteres)
      too_short:
        one: es demasiado corto (mínimo 1 carácter)
        other: es demasiado corto (mínimo %{count} caracteres)
      wrong_length:
        one: tiene una longitud incorrecta (debe tener 1 carácter)
        other: tiene una longitud incorrecta (debe tener %{count} caracteres)
      other_than: debe ser distinto de %{count}
  activerecord:
    models:
      user: Usuario
      prospect: Contacto
    attributes:
      user:
        email: Correo electrónico
        password: Contraseña
        password_confirmation: Confirmación de contraseña
        current_password: Contraseña actual
      prospect:
        email: Correo electrónico
  helpers:
    select:
      prompt: Selecciona una opción
    submit:
      create: Crear %{model}
      update: Actualizar %{model}
      submit: Guardar %{model}
  support:
    array:
      words_connector: ', '
      two_words_connector: ' y '
      last_word_connector: ' y '
  number:
    format:
      separator: ','
      delimiter: '.'
      precision: 3
      significant: false
      strip_insignificant_zeros: false
    currency:
      format:
        format: '%n %u'
        unit: '€'
        separator: ','
        delimiter: '.'
        precision: 2
    percentage:
      format:
        format: '%n %'
    precision:
      format:
        delimiter: ''
    human:
      format:
        precision: 3
        significant: true
        strip_insignificant_zeros: true
      decimal_units:
        format: '%n %u'
        units:
          unit: ''
          thousand: mil
          million: millones
          billion: mil millones
          trillion: billones
          quadrillion: mil billones
      storage_units:
        format: '%n %u'
        units:
          byte:
            one: byte
            other: bytes
          kb: KB
          mb: MB
          gb: GB
          tb: TB
