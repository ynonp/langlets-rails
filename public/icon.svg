<svg width="512" height="512" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="229" fill="url(#bg)"/>

  <g transform="translate(512, 480)" filter="url(#glow)">
    <path d="M -180 -130 
             C -260 -130, -280 -60, -280 20 
             L -280 80 
             C -280 140, -240 170, -180 170 
             L -60 170 
             L 0 240 
             L 60 170 
             L 180 170 
             C 240 170, 280 140, 280 80 
             L 280 20 
             C 280 -60, 260 -130, 180 -130 
             Z" 
          fill="none" 
          stroke="url(#accent)" 
          stroke-width="36" 
          stroke-linejoin="round"/>
    <path d="M -50 -30 L -50 70 L 70 20 Z" fill="url(#accent)"/>
  </g>
</svg>
