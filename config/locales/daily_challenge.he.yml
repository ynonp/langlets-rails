        body: "מצאנו סרטון שאנחנו מקווים שתאהבו, בהשראת הסרטונים ואוצר המילים שלכם. צפו בתצוגה המקדימה והפכו אותו ללנגלט הבא שלכם."
      song:
        title: ייבוא שיר
        body: בחרו שיר בשפה שאתם לומדים וייבאו אותו כדי להפוך את המילים ללנגלט הבא
          שלכם. שיר אחד מספיק, גם אם בחרתם כמה שפות.
      vocabulary:
        title: שמירת ארבע מילים
        body: פתחו לנגלט, לחצו על מילים שתרצו לזכור ושמרו ארבע מילים לאוצר המילים.
          בחרו מילים שימושיות לחיי היום־יום.
      story:
        title: ייבוא סיפור קצר
        body: בחרו סיפור קצר בשפה שאתם לומדים וייבאו אותו. עקבו אחרי הדמויות וגלו
          כמה אתם מבינים.
      tiktok:
        title: ייבוא סרטון טיקטוק
        body: מצאו סרטון קצר עם דיבור ברור בשפה שאתם לומדים. ייבאו את הקישור והפכו
          רגע מחיי היום־יום לתרגול.
      skim:
        title: לימוד לנגלט ברצף
        body: פתחו לנגלט וצפו בסרטון. אפשר ללחוץ על ״דלג על השיעור״ כדי לעבור בין
          השיעורים בלי לבצע כל תרגיל. עקבו אחר הסיפור בקצב שלכם, בישיבה אחת.
